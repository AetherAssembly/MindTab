<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MindTab Settings</title>
  <link rel="stylesheet" href="options.css" />
</head>
<body>
  <main>
    <h1>MindTab Settings</h1>

    <section>
      <h2>Features</h2>
      <label><input type="checkbox" id="toneEnabled"> Enable Tone Translator</label>
      <label><input type="checkbox" id="flashcardsEnabled"> Enable Flashcards Overlay</label>
    </section>

    <section>
      <h2>Flashcards</h2>
      <p>Add / edit flashcards here. Each entry should have a question and an answer.</p>
      <div id="cards"></div>
      <button id="addCard">Add Card</button>
      <div class="field">
        <label for="throttle">Flashcard throttle (minutes)</label>
        <input id="throttle" type="number" min="1" value="30" />
      </div>
    </section>

    <section>
      <button id="save">Save Settings</button>
    </section>

  </main>
  <script src="options.js"></script>
</body>
</html>
