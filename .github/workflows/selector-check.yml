name: Selector Check

on:
  pull_request:
    paths:
      - 'config/filters.json'
  push:
    branches: [main]
    paths:
      - 'config/filters.json'

jobs:
  validate:
    name: Validate CSS selectors
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: node .github/scripts/check-selectors.js
