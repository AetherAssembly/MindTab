name: Lint & Test

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  web-ext-lint:
    name: web-ext lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: |
          npx web-ext lint \
            --source-dir . \
            --ignore-files "server/**" \
            --ignore-files "sources/**" \
            --ignore-files ".github/**" \
            --ignore-files "tests/**" \
            --ignore-files "node_modules/**" \
            --ignore-files "*.md"

  test:
    name: Vitest unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
      - run: npm ci
      - run: npm test
