name: Stale

on:
  schedule:
    # Weekly on Mondays at 00:00 UTC
    - cron: '0 0 * * 1'
  workflow_dispatch:

permissions:
  issues: write
  pull-requests: write

jobs:
  stale:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/stale@v10
        with:
          days-before-stale: 60
          days-before-close: 7
          stale-issue-label: stale
          stale-pr-label: stale
          stale-issue-message: >
            This issue has had no activity for 60 days. It will be closed in 7 days
            unless there is new activity. If this is still relevant, please leave a comment.
          stale-pr-message: >
            This PR has had no activity for 60 days. It will be closed in 7 days
            unless there is new activity. If it's still in progress, please leave a comment.
          close-issue-message: Closed due to inactivity. Feel free to reopen if this is still relevant.
          close-pr-message: Closed due to inactivity. Feel free to reopen if still relevant.
          exempt-issue-labels: 'pinned,security'
          exempt-pr-labels: 'pinned,security'
