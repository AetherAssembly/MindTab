filters:
  - changed-files:
    - any-glob-to-any-file: ['config/filters.json']

content-script:
  - changed-files:
    - any-glob-to-any-file: ['content_scripts/**']

ui:
  - changed-files:
    - any-glob-to-any-file: ['ui/**']

manifest:
  - changed-files:
    - any-glob-to-any-file: ['manifest.json']

background:
  - changed-files:
    - any-glob-to-any-file:
      - 'background.js'
      - 'utils.js'

docs:
  - changed-files:
    - any-glob-to-any-file:
      - '*.md'
      - 'sources/**'

config:
  - changed-files:
    - any-glob-to-any-file: ['config/**']
