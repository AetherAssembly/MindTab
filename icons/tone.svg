<!-- tone.svg - Speech + emotion metaphor -->
<svg width="24" height="24" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
  <!-- Speech bubble -->
  <path d="M3 12c0-4.97 4.03-9 9-9s9 4.03 9 9-4.03 9-9 9c-1.67 0-3.22-.46-4.56-1.26L3 21l1.26-4.44C3.46 15.22 3 13.67 3 12z" 
        fill="#6366F1" opacity="0.1" stroke="#6366F1" stroke-width="2"/>
  
  <!-- Emotion indicators -->
  <circle cx="9" cy="10" r="1" fill="#6366F1"/>
  <circle cx="15" cy="10" r="1" fill="#6366F1"/>
  
  <!-- Mood line (changes based on tone) -->
  <path d="M8 14c1 2 3 2 4 0s3-2 4 0" stroke="#6366F1" stroke-width="2" fill="none"/>
  
  <!-- Sound waves -->
  <path d="M18 8c1 1 1 3 0 4m2-6c2 2 2 6 0 8" stroke="#6366F1" stroke-width="1.5" fill="none" opacity="0.7"/>
</svg>

<!-- This SVG represents a tone icon that combines the concept of speech with emotional indicators. --> 