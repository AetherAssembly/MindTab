<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MindTab</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="header">
    <img src="../icons/mindtab48.svg" alt="MindTab logo" width="32" height="32">
    <h1>MindTab</h1>
  </div>

  <div class="modules">
    <label class="module" for="toggle-feed">
      <div class="module-info">
        <span class="module-name">Feed Sanitizer</span>
        <span class="module-desc">Removes Shorts &amp; Reels</span>
      </div>
      <div class="toggle">
        <input type="checkbox" id="toggle-feed" data-key="feedSanitizer">
        <span class="slider"></span>
      </div>
    </label>

    <label class="module" for="toggle-ad">
      <div class="module-info">
        <span class="module-name">Ad Blocker</span>
        <span class="module-desc">Blocks malicious &amp; scam ads</span>
      </div>
      <div class="toggle">
        <input type="checkbox" id="toggle-ad" data-key="adBlocker">
        <span class="slider"></span>
      </div>
    </label>

    <label class="module" for="toggle-tone">
      <div class="module-info">
        <span class="module-name">Tone Translator</span>
        <span class="module-desc">Reads tone as you type</span>
      </div>
      <div class="toggle">
        <input type="checkbox" id="toggle-tone" data-key="toneTranslator">
        <span class="slider"></span>
      </div>
    </label>

    <label class="module" for="toggle-flash">
      <div class="module-info">
        <span class="module-name">Flashcards</span>
        <span class="module-desc">Learn while you browse</span>
      </div>
      <div class="toggle">
        <input type="checkbox" id="toggle-flash" data-key="flashcards">
        <span class="slider"></span>
      </div>
    </label>
  </div>

  <div class="actions">
    <button id="btn-cards" class="btn btn-primary">Manage Flashcards</button>
  </div>

  <details class="settings" id="settings-panel">
    <summary>Settings</summary>
    <div class="settings-body">
      <label class="settings-label" for="tone-api-url">
        Grammar Server URL
        <span class="settings-hint">LanguageTool-compatible server — leave blank for local-only analysis</span>
      </label>
      <input
        type="url"
        id="tone-api-url"
        class="settings-input"
        placeholder="https://your-pi.example.com"
      >
      <span class="settings-hint" style="font-size:10px;margin-top:-2px">
        Self-host LanguageTool on a Pi for free grammar checking
      </span>
      <button id="btn-save-settings" class="btn btn-secondary">Save</button>
      <span id="settings-saved" class="saved-msg" aria-live="polite"></span>

      <div class="settings-divider"></div>

      <div class="settings-label">
        Feed Filter Lists
        <span class="settings-hint">uBlock Origin &amp; AdGuard lists — auto-updated every 24 h</span>
      </div>
      <div class="filter-status-row">
        <span id="filter-status" class="filter-status">Checking…</span>
        <button id="btn-update-filters" class="btn btn-secondary">Update Now</button>
      </div>
      <span id="filter-update-msg" class="saved-msg" aria-live="polite"></span>
    </div>
  </details>

  <div class="footer">
    by <a href="https://aster1630.carrd.co" target="_blank" rel="noopener">Aster1630</a>
  </div>

  <script src="popup.js"></script>
</body>
</html>
